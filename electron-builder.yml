appId: com.oleksandrkovaliuk.relay
productName: Relay
copyright: © ${author}

protocols:
  - name: Relay
    schemes: [relay]

# No native modules to rebuild, and the rebuild step shells out to `pnpm install`,
# which fails on pnpm's ignored-build-scripts warning.
npmRebuild: false

directories:
  buildResources: build
  output: dist

# electron-vite has already bundled everything into out/.
files:
  - out/**
  - package.json
# The dock/window icon is read from disk at runtime, so it must stay a real file
# outside the asar archive.
extraResources:
  - resources/**

mac:
  category: public.app-category.education
  # Apple Silicon only. The release runner is arm64, so pnpm resolves only the arm64
  # variants of the arch-specific runtime dependencies (`@anthropic-ai/claude-agent-sdk-*`,
  # `@esbuild/*`). An x64 build on this runner therefore packaged an Intel Electron around
  # arm64 helpers — a broken app that also made macOS warn about Rosetta being retired.
  # zip alongside dmg: electron-updater reads the zip, humans read the dmg.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # Production builds discover a Developer ID identity from CSC_LINK. The release
  # workflow explicitly falls back to ad-hoc signing while those credentials are
  # unavailable, which keeps Apple Silicon builds internally consistent.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Gatekeeper needs this cleared for a signed build; an unsigned build is
  # ad-hoc signed and will warn on first open.
  notarize: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  # x64 only, for the same reason as macOS: the release runner is x64, so an arm64
  # installer would carry x64 helper binaries. Windows on ARM runs the x64 installer
  # under emulation, so nothing is lost by shipping one architecture.
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target: [AppImage, deb]
  category: Education
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  provider: github
  owner: oleksandrkovaliuk
  repo: relay
