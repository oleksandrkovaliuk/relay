packages: []

allowBuilds:
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  electron: true
  # Windows installer helper; nothing to build for a macOS release.
  electron-winstaller: false
  esbuild: true
  utf-8-validate: false

minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.25'
  - '@tanstack/router-core@1.171.21'
  - '@tanstack/router-generator@1.167.27'
  - '@tanstack/router-plugin@1.168.29'
  - '@clerk/clerk-js@6.29.2'
  - '@clerk/electron@0.0.33'
  - '@clerk/react@6.14.4'
  - '@clerk/shared@4.29.2'
# electron-builder's pnpm dependency collector drops transitive runtime modules from
# app.asar, which shipped a 0.3.1 that crashed on launch looking for `ajv` (reached via
# @clerk/electron -> electron-store -> conf). Tracked upstream as
# https://github.com/electron-userland/electron-builder/issues/10000 — remove this patch
# once a release contains the fix. `pnpm` is pinned in package.json for the same reason:
# the collector misreads pnpm 11's deduplicated `pnpm list` output.
patchedDependencies:
  app-builder-lib@26.15.3: patches/app-builder-lib@26.15.3.patch
