<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <meta name="application-name" content="Relay" />
    <meta name="theme-color" content="#007A56" />
    <meta
      name="description"
      content="Interactive homework shared by your teacher with Relay."
    />
    <!-- Homework links get pasted into messaging apps, so the unfurl is part of
         the product: name, one line, and the mark rather than a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Relay" />
    <meta property="og:title" content="Your homework · Relay" />
    <meta
      property="og:description"
      content="Open the link your teacher sent to start. It saves as you go."
    />
    <meta property="og:image" content="./assets/relay-app-icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="../assets/relay-app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../assets/relay-app-icon-512.png" />
    <title>Your homework · Relay</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
