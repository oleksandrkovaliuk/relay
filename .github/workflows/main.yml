name: main

# The quality gate runs for every push and pull request; only a push to the
# default branch deploys, so a red check can never reach students.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck, both test suites, and all three builds.
      - run: pnpm check
        env:
          # The renderer needs a Convex URL at build time; the checked build is
          # never shipped, so the production URL is enough to compile against.
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_PLAYER_ORIGIN: ${{ vars.VITE_PLAYER_ORIGIN }}

  # `pnpm check` compiles the renderer but never runs the packaged app, so it cannot
  # see a runtime dependency that failed to make it into `app.asar`. That is how 0.3.1
  # shipped an app which crashed on launch looking for `ajv`. Packaging and launching a
  # Linux build is the cheapest gate that reproduces the real module resolution.
  packaged-runtime:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_PLAYER_ORIGIN: ${{ vars.VITE_PLAYER_ORIGIN }}
      - run: pnpm exec electron-builder --linux dir --publish never
      - name: Launch the packaged app
        run: xvfb-run -a pnpm verify:packaged

  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pushes the schema and functions, builds the student player against the
      # production deployment, and uploads it — one command, one deployment.
      - run: pnpm deploy:web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_PLAYER_ORIGIN: ${{ vars.VITE_PLAYER_ORIGIN }}
